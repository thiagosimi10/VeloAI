# VeloAI — Fundação (Fase 1-5 parcial)
#
# Uso:
#   cp .env.example .env
#   docker compose up -d
#
# Nenhuma instalação manual é necessária (docs/00-AI-CONSTITUTION.md, "Docker").

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  provisioning:
    build:
      context: .
      dockerfile: provisioning/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      # Código-fonte montado do host — qualquer alteração salva já reinicia o uvicorn
      # sozinho (--reload), sem precisar rebuildar a imagem.
      - ./backend/app:/srv/backend/app
      - ./shared:/srv/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      provisioning:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  ai-gateway:
    build:
      context: .
      dockerfile: ai-gateway/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "8002:8002"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:5173"
    volumes:
      # Código-fonte montado do host — qualquer alteração salva já dispara o hot-reload
      # do Vite dentro do container, sem precisar rebuildar a imagem.
      - ./frontend:/srv/frontend
      # Volume nomeado só para node_modules: evita que o node_modules instalado no
      # Windows (fora do container) sobrescreva o instalado no Linux dentro dele.
      - frontend_node_modules:/srv/frontend/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  frontend_node_modules:
