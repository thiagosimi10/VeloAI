name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, provisioning, ai-gateway]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # A imagem oficial minio/minio exige o argumento de linha de comando "server
      # /data", que o schema de `services:` do GitHub Actions não permite passar (só
      # image/env/ports/options — sem override de comando). bitnami/minio inicia como
      # servidor usando só variáveis de ambiente, o padrão da comunidade para rodar
      # MinIO como serviço de CI. Sem isso, test_attachments_flow.py (Fase 12) sempre
      # pulava, até no CI.
      minio:
        image: bitnami/minio:latest
        env:
          MINIO_ROOT_USER: veloai_minio
          MINIO_ROOT_PASSWORD: change-me-in-production
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Sem configuração especial — mesma imagem/healthcheck do docker-compose.yml. Sem
      # isso, test_knowledge_flow.py (Fase 15) e a suíte de integração do Provisioning
      # (Fase 15/17) sempre pulavam, até no CI.
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
        options: >-
          --health-cmd "curl -f http://localhost:6333/healthz"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAINTENANCE_DB: postgres
      REDIS_URL: redis://localhost:6379/0
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: veloai_minio
      MINIO_SECRET_KEY: change-me-in-production
      MINIO_USE_SSL: "false"
      QDRANT_URL: http://localhost:6333

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: Black
        working-directory: ${{ matrix.service }}
        run: black --check .

      - name: MyPy
        working-directory: ${{ matrix.service }}
        run: mypy app

      - name: Pytest + Coverage
        working-directory: ${{ matrix.service }}
        run: pytest

      - name: Upload coverage (${{ matrix.service }})
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.xml
          retention-days: 7

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        working-directory: shared
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: shared
        run: ruff check .

      - name: Black
        working-directory: shared
        run: black --check .

      - name: MyPy
        working-directory: shared
        run: mypy veloai_shared

      - name: Pytest + Coverage
        working-directory: shared
        run: pytest
