name: Backend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, provisioning, ai-gateway]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_MAINTENANCE_DB: postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Ruff
        working-directory: ${{ matrix.service }}
        run: ruff check .

      - name: Black
        working-directory: ${{ matrix.service }}
        run: black --check .

      - name: MyPy
        working-directory: ${{ matrix.service }}
        run: mypy app

      - name: Pytest + Coverage
        working-directory: ${{ matrix.service }}
        run: pytest

      - name: Upload coverage (${{ matrix.service }})
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: ${{ matrix.service }}/coverage.xml
          retention-days: 7

  shared:
    name: shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        working-directory: shared
        run: pip install -e ".[dev]"

      - name: Ruff
        working-directory: shared
        run: ruff check .

      - name: Black
        working-directory: shared
        run: black --check .

      - name: MyPy
        working-directory: shared
        run: mypy veloai_shared

      - name: Pytest + Coverage
        working-directory: shared
        run: pytest
