[project]
name = "veloai-shared"
version = "1.0.0"
description = "Utilitários compartilhados entre os serviços Python do VeloAI (response envelope, exceptions, logging, health check, segurança)."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "structlog>=24.4",
    "argon2-cffi>=23.1",
    "uuid_utils>=0.9",
    "sqlalchemy>=2.0",
    "PyJWT>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "black>=24.10",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["veloai_shared*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=veloai_shared --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["veloai_shared"]
