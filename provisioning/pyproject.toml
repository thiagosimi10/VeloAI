[project]
name = "veloai-provisioning"
version = "0.1.0"
description = "VeloAI — Provisioning Service (único serviço com privilégios administrativos de banco)."
requires-python = ">=3.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
exclude = ["alembic_master", "alembic_tenant"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
